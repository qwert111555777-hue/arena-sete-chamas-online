<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Arena das Sete Chamas Online</title>
  <link rel="stylesheet" href="styles.css?v=27" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="menuScreen" class="screen active menu-screen">
    <div class="hero-bg"></div>
    <main class="menu-card glass">
      <div class="logo-line">🔥 Arena das Sete Chamas</div>
      <h1>Entrar</h1>

      <div class="name-row">
        <label>Seu nome</label>
        <input id="nameInput" maxlength="18" placeholder="Ex: Player 1" />
      </div>

      <div class="join-grid">
        <button id="createBtn" class="big-btn primary">Criar sala</button>
        <div class="join-box">
          <input id="roomInput" maxlength="4" placeholder="CÓDIGO" />
          <button id="joinBtn" class="big-btn">Entrar por código</button>
        </div>
      </div>

      <section class="rooms-box">
        <div class="rooms-head compact-head">
          <h3>Salas abertas</h3>
          <button id="refreshRoomsBtn" class="small-btn ghost">Atualizar</button>
        </div>
        <div id="openRoomsList" class="open-rooms-list">Carregando salas...</div>
      </section>

      <div class="menu-actions">
        <a id="apkBtn" class="small-btn ghost apk-btn" href="/ArenaSeteChamas-v16.apk" download>APK Android</a>
        <button id="fullscreenMenuBtn" class="small-btn ghost" type="button">Tela cheia</button>
      </div>
    </main>
  </section>

  <section id="lobbyScreen" class="screen lobby-screen">
    <header class="topbar glass">
      <div>
        <div class="tiny">Sala online</div>
        <h2 id="roomTitle">Sala ----</h2>
      </div>
      <div class="top-actions">
        <button id="fullscreenLobbyBtn" class="small-btn ghost">Tela cheia</button>
        <button id="copyBtn" class="small-btn">Copiar código</button>
        <button id="leaveBtn" class="small-btn ghost">Sair</button>
      </div>
    </header>

    <main class="lobby-grid">
      <section class="glass panel">
        <h3>Dificuldade</h3>
        <div id="difficultyButtons" class="difficulty-buttons"></div>
      </section>

      <section class="glass panel players-panel">
        <h3>Jogadores</h3>
        <div id="playersList" class="players-list"></div>
        <div class="start-row">
          <button id="readyBtn" class="big-btn">Estou pronto</button>
          <button id="startBtn" class="big-btn primary">Iniciar partida</button>
        </div>
      </section>

      <section class="glass panel heroes-panel">
        <div class="panel-title-row">
          <div>
            <h3>Heróis</h3>
          </div>
        </div>
        <div id="heroCards" class="hero-cards"></div>
      </section>

    </main>
  </section>

  <section id="gameScreen" class="screen game-screen">
    <canvas id="gameCanvas"></canvas>

    <div class="game-hud top-hud glass">
      <div class="hud-buttons">
        <button id="fullscreenGameBtn" class="small-btn ghost">Tela cheia</button>
        <button id="backLobbyBtn" class="small-btn ghost">Lobby</button>
      </div>
      <div class="hidden-game-info">
        <h2 id="hudStage">Carregando...</h2>
        Sala <strong id="hudRoom">----</strong> · <span id="hudDiff">Médio</span><span id="hudSub"></span>
      </div>
    </div>

    <div id="teamHud" class="team-hud glass"></div>
    <div id="abilityHud" class="ability-hud glass"></div>
    <div id="bossHud" class="boss-hud glass"></div>
    <div id="messagesHud" class="messages-hud"></div>

    <div class="controls">
      <div id="joystick" class="joystick">
        <div id="stick" class="stick"></div>
      </div>
      <div class="action-buttons">
        <button id="attackTouch" class="action attack">ATACAR<span>Mouse/Espaço</span></button>
        <button id="specialTouch" class="action special">HABILIDADE<span>Q</span></button>
        <button id="ultimateTouch" class="action ultimate">ULTIMATE<span>E</span></button>
      </div>
    </div>

    <div id="orientationHint" class="orientation-hint glass">
      <h2>Vire o celular</h2>
    </div>

    <div id="endOverlay" class="end-overlay glass hidden">
      <h1 id="endTitle">Fim</h1>
      <p id="endText">Resultado</p>
      <div class="end-actions">
        <button id="playAgainBtn" class="big-btn primary">Voltar ao lobby</button>
      </div>
    </div>
  </section>


  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js?v=27"></script>
</body>
</html>
